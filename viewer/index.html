<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>star-dump</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #ebf3ff;
        font: 11px "IBM Plex Sans", system-ui, sans-serif;
      }

      #view, #overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #overlay { pointer-events: none; }

      #minimap {
        position: absolute;
        right: 14px;
        bottom: 14px;
        display: none;
        border: 1px solid rgba(159, 184, 222, 0.2);
        border-radius: 8px;
      }

      .panel {
        position: absolute;
        top: 14px;
        padding: 9px 11px;
        border: 1px solid rgba(159, 184, 222, 0.2);
        border-radius: 10px;
        background: rgba(4, 7, 13, 0.82);
        backdrop-filter: blur(18px);
        display: grid;
        gap: 4px;
      }

      #controls { left: 14px; width: 270px; }
      #stats { right: 14px; width: 200px; pointer-events: none; }

      .title {
        margin: 0 0 2px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .row {
        display: grid;
        grid-template-columns: 68px 1fr auto;
        align-items: center;
        gap: 6px;
      }

      #stats .row { grid-template-columns: 1fr auto; }

      .label {
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: rgba(235, 243, 255, 0.5);
      }

      .value {
        font-variant-numeric: tabular-nums;
        text-align: right;
        color: rgba(235, 243, 255, 0.9);
      }

      #controls .value { width: 56px; }

      .copy {
        pointer-events: auto;
        margin-left: 6px;
        padding: 0 3px;
        border: 1px solid rgba(159, 184, 222, 0.25);
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.06);
        color: inherit;
        font: inherit;
        line-height: 1.2;
        cursor: pointer;
      }

      .copy:hover { background: rgba(255, 255, 255, 0.16); }

      .slider {
        width: 100%;
        height: 3px;
        margin: 0;
        accent-color: #7aa2e8;
      }

      .select {
        grid-column: 2 / 4;
        background: rgba(255, 255, 255, 0.06);
        color: inherit;
        border: 1px solid rgba(159, 184, 222, 0.25);
        border-radius: 5px;
        font: inherit;
        padding: 2px 4px;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <canvas id="overlay"></canvas>
    <canvas id="minimap"></canvas>
    <script type="module" src="dist/main.js"></script>
  </body>
</html>
